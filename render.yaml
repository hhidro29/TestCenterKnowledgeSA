services:
  - type: web
    name: test-center-knowledge-chatbot
    runtime: node
    rootDir: prototype
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_REQUESTS_PER_MINUTE
        value: "30"
