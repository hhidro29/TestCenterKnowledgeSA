<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brain Academy Assistant</title>
    <style>
      :root { --ink:#1f2937; --muted:#778196; --line:#e5e9f0; --blue:#2f6fed; --blue-dark:#1e55bf; --chat:#edf3f8; --white:#fff; }
      * { box-sizing:border-box; }
      html, body { height:100%; }
      body { margin:0; color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--chat); }
      button, select, textarea { font:inherit; }
      .app { width:100%; height:100vh; min-height:0; overflow:hidden; background:var(--white); display:flex; flex-direction:column; }
      .topbar { height:76px; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--white); }
      .identity { display:flex; align-items:center; gap:12px; min-width:0; }
      .avatar { width:46px; height:46px; display:grid; place-items:center; flex:0 0 auto; color:#fff; font-weight:900; letter-spacing:-.06em; border-radius:50%; background:linear-gradient(140deg,#3a7cf3,#7a6ff1); box-shadow:0 6px 14px rgba(47,111,237,.23); }
      .name { margin:0; font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .presence { margin-top:3px; color:var(--muted); font-size:12px; display:flex; align-items:center; gap:6px; }
      .presence-dot { width:7px; height:7px; border-radius:50%; background:#efad42; }
      .presence-dot.ready { background:#1ca36e; }
      .controls { display:flex; align-items:center; gap:10px; }
      .compare-toggle { display:inline-flex; align-items:center; gap:5px; min-height:34px; padding:0 10px; border:1px solid var(--line); border-radius:9px; color:var(--muted); background:#fff; font-size:11px; font-weight:800; cursor:pointer; }
      .compare-toggle:hover, .compare-toggle.active { border-color:#aac4f8; color:var(--blue-dark); background:#f4f8ff; }
      .model-picker { display:flex; align-items:center; gap:7px; padding:4px 8px 4px 10px; border:1px solid var(--line); border-radius:9px; color:var(--muted); background:#f8fafc; font-size:11px; font-weight:800; }
      .model-picker select { max-width:220px; padding:5px 22px 5px 3px; border:0; outline:0; color:var(--ink); background:transparent; font-size:11px; font-weight:800; }
      .more { width:34px; height:34px; border:0; color:var(--muted); background:transparent; border-radius:50%; font-size:22px; cursor:pointer; }
      .more:hover { background:#f2f5f9; }
      .conversation { flex:1; min-height:0; display:flex; flex-direction:column; background:var(--chat); }
      .messages { flex:1; overflow-y:auto; padding:18px 16px 12px; display:flex; flex-direction:column; gap:8px; background-color:#edf3f8; background-image:radial-gradient(rgba(103,125,149,.12) .8px, transparent .8px); background-size:18px 18px; }
      .welcome { align-self:center; max-width:430px; margin:auto; padding:24px 22px; text-align:center; background:rgba(255,255,255,.9); border:1px solid rgba(220,228,237,.85); border-radius:18px; box-shadow:0 8px 24px rgba(45,63,86,.06); }
      .welcome-icon { width:42px; height:42px; margin:0 auto 11px; display:grid; place-items:center; border-radius:14px; color:var(--blue); background:#e8efff; font-size:20px; }
      .welcome h1 { margin:0 0 8px; color:var(--ink); font-size:21px; letter-spacing:-.03em; }
      .welcome p { margin:0; color:var(--muted); line-height:1.5; font-size:13px; }
      .suggestions { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin-top:17px; }
      .suggestion { border:1px solid #d7e1f3; color:#2c5fc0; background:#f8fbff; border-radius:999px; padding:8px 11px; font-size:11px; cursor:pointer; }
      .suggestion:hover { border-color:#aac4f8; background:#fff; }
      .msg-row { display:flex; flex-direction:column; max-width:78%; }
      .msg-row.user { align-self:flex-end; align-items:flex-end; }
      .msg-row.assistant { align-self:flex-start; align-items:flex-start; }
      .msg { padding:10px 13px 8px; color:var(--ink); line-height:1.5; font-size:14px; box-shadow:0 1px 1px rgba(35,50,70,.06); }
      .rich-text p { margin:0 0 9px; }
      .rich-text p:last-child { margin-bottom:0; }
      .rich-text ul, .rich-text ol { margin:4px 0 9px 19px; padding:0; }
      .rich-text li { margin:3px 0; padding-left:2px; }
      .rich-text strong { font-weight:750; }
      .msg-row.user .msg { color:#143e2d; background:#d9fdd3; border-radius:15px 15px 4px 15px; }
      .msg-row.assistant .msg { background:#fff; border-radius:15px 15px 15px 4px; }
      .comparison-row { align-self:stretch; max-width:100%; }
      .comparison-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
      .comparison-card { min-width:0; overflow:hidden; border:1px solid #dbe3ec; border-radius:12px; background:#fff; box-shadow:0 1px 1px rgba(35,50,70,.06); }
      .comparison-card-head { padding:9px 10px; border-bottom:1px solid #edf0f4; color:#52617a; background:#f8fafc; font-size:11px; font-weight:800; }
      .comparison-card-body { padding:10px 11px; color:var(--ink); font-size:13px; line-height:1.5; }
      .comparison-card-body .rich-text p { margin-bottom:8px; }
      .comparison-card.error .comparison-card-body, .comparison-card.unavailable .comparison-card-body { color:#8994a5; font-size:12px; }
      .comparison-status { display:block; margin-top:4px; color:#d97706; font-size:10px; font-weight:700; }
      .msg-meta { display:flex; align-items:center; gap:7px; margin:3px 4px 0; color:#8994a5; font-size:10px; }
      .msg-row.user .msg-meta { justify-content:flex-end; }
      .tick { color:#3e80e8; font-size:12px; }
      .composer-zone { padding:10px 16px 12px; border-top:1px solid rgba(212,222,232,.8); background:#f7f9fb; }
      .composer { display:flex; align-items:flex-end; gap:9px; max-width:none; margin:0; }
      .icon-button { width:40px; height:40px; flex:0 0 auto; border:0; border-radius:50%; color:#8190a4; background:transparent; font-size:19px; cursor:pointer; }
      .icon-button:hover { background:#eaf0f6; }
      textarea { flex:1; min-height:42px; max-height:126px; resize:none; padding:11px 14px; border:1px solid #d9e1eb; border-radius:21px; outline:none; color:var(--ink); background:#fff; line-height:1.35; }
      textarea:focus { border-color:#9dbcf4; box-shadow:0 0 0 3px rgba(47,111,237,.1); }
      .send { width:42px; height:42px; flex:0 0 auto; border:0; border-radius:50%; color:#fff; background:var(--blue); font-size:18px; cursor:pointer; box-shadow:0 5px 12px rgba(47,111,237,.24); }
      .send:hover { background:var(--blue-dark); }
      .send:disabled { opacity:.55; cursor:wait; }
      .note { max-width:none; margin:6px 0 0; color:#9aa5b4; text-align:right; font-size:10px; }
      @media (max-width:700px) { .topbar { padding:10px 12px; } .model-picker { padding:4px 6px; } .model-picker span { display:none; } .model-picker select { max-width:145px; } .more { display:none; } .messages { padding:14px 10px 10px; } .msg-row { max-width:89%; } .welcome { margin:auto 6px; } .composer-zone { padding:9px 7px 11px; } .icon-button { display:none; } }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="identity">
          <div class="avatar">BA</div>
          <div><div class="name">Brain Academy Assistant</div><div class="presence"><span class="presence-dot" id="statusDot"></span><span id="statusText">Memeriksa koneksi…</span></div></div>
        </div>
        <div class="controls"><label class="model-picker"><span>Model</span><select id="model" aria-label="Pilih model"></select></label><button class="compare-toggle" id="compareToggle" type="button" aria-pressed="false">⇄ Bandingkan</button><button class="more" type="button" aria-label="Info">⋮</button></div>
      </header>
      <section class="conversation">
        <div class="messages" id="messages">
          <div class="welcome" id="empty">
            <div class="welcome-icon">✦</div><h1>Cari info atau siapkan rekomendasi siswa</h1>
            <p>Asisten kerja untuk Student Advisor. Tanyakan prosedur, atau ceritakan kebutuhan siswa secara anonim untuk menyusun opsi tindak lanjut.</p>
            <div class="suggestions"><button class="suggestion">Apa tahapan pendaftaran sekolah kedinasan 2026?</button><button class="suggestion">Siswa kelas 12 ingin mulai persiapan UTBK. Dukungan apa yang tersedia?</button><button class="suggestion">Apa yang perlu dikonfirmasi sebelum merekomendasikan program?</button></div>
          </div>
        </div>
        <div class="composer-zone"><form class="composer" id="composer"><button class="icon-button" type="button" aria-label="Lampiran">＋</button><textarea id="input" placeholder="Tanyakan ke rekan SA…" rows="1"></textarea><button class="send" id="send" type="submit" aria-label="Kirim">➤</button></form><div class="note" id="modeNote">Asisten Student Advisor · info diperbarui 6 Oktober 2026</div></div>
      </section>
    </div>
    <script>
      const messagesEl = document.getElementById('messages');
      const emptyEl = document.getElementById('empty');
      const inputEl = document.getElementById('input');
      const sendEl = document.getElementById('send');
      const modelEl = document.getElementById('model');
      const statusText = document.getElementById('statusText');
      const statusDot = document.getElementById('statusDot');
      const modeNote = document.getElementById('modeNote');
      const compareToggle = document.getElementById('compareToggle');
      const history = [];
      let compareMode = false;

      function clock() { return new Intl.DateTimeFormat('id-ID', { hour:'2-digit', minute:'2-digit' }).format(new Date()); }
      function escapeHtml(value) { return String(value || '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
      function formatInline(value) {
        return escapeHtml(value)
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '$1')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g, '<em>$1</em>')
          .replace(/__([^_\n]+?)__/g, '<strong>$1</strong>')
          .replace(/(?<!_)_([^_\n]+?)_(?!_)/g, '<em>$1</em>');
      }
      function formatAssistant(text) {
        const lines = String(text || '').replace(/\r/g, '').split('\n');
        const fragment = document.createDocumentFragment();
        let list = null;
        let paragraph = [];
        const flushParagraph = () => { if (!paragraph.length) return; const p = document.createElement('p'); p.innerHTML = formatInline(paragraph.join(' ')); fragment.appendChild(p); paragraph = []; };
        const closeList = () => { if (list) { fragment.appendChild(list); list = null; } };
        lines.forEach((line) => {
          const trimmed = line.trim();
          const bullet = trimmed.match(/^[-*•]\s+(.+)/);
          const numbered = trimmed.match(/^\d+[.)]\s+(.+)/);
          if (!trimmed) { flushParagraph(); closeList(); return; }
          if (bullet || numbered) {
            flushParagraph();
            const type = numbered ? 'ol' : 'ul';
            if (!list || list.tagName.toLowerCase() !== type) { closeList(); list = document.createElement(type); }
            const li = document.createElement('li'); li.innerHTML = formatInline((bullet || numbered)[1]); list.appendChild(li); return;
          }
          closeList();
          if (/^#{1,3}\s+/.test(trimmed)) { flushParagraph(); const p = document.createElement('p'); p.innerHTML = `<strong>${formatInline(trimmed.replace(/^#{1,3}\s+/, ''))}</strong>`; fragment.appendChild(p); return; }
          paragraph.push(trimmed);
        });
        flushParagraph(); closeList();
        return fragment;
      }
      function addMessage(kind, text, meta) {
        if (emptyEl) emptyEl.remove();
        const row = document.createElement('div'); row.className = `msg-row ${kind}`;
        const bubble = document.createElement('div'); bubble.className = 'msg';
        if (kind === 'assistant') { const rich = document.createElement('div'); rich.className = 'rich-text'; rich.appendChild(formatAssistant(text)); bubble.appendChild(rich); }
        else bubble.textContent = text;
        row.appendChild(bubble);
        const stamp = document.createElement('div'); stamp.className = 'msg-meta'; stamp.textContent = `${meta || (kind === 'user' ? 'Anda' : 'Brain Academy Assistant')} · ${clock()}`;
        if (kind === 'user') { const tick = document.createElement('span'); tick.className = 'tick'; tick.textContent = '✓✓'; stamp.appendChild(tick); }
        row.appendChild(stamp); messagesEl.appendChild(row); messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      function addComparison(results) {
        if (emptyEl) emptyEl.remove();
        const row = document.createElement('div'); row.className = 'comparison-row';
        const grid = document.createElement('div'); grid.className = 'comparison-grid';
        (results || []).forEach((result) => {
          const card = document.createElement('article'); card.className = `comparison-card ${result.status || 'error'}`;
          const head = document.createElement('div'); head.className = 'comparison-card-head'; head.textContent = result.label || result.id || 'Model';
          const body = document.createElement('div'); body.className = 'comparison-card-body';
          if (result.status === 'success') { const rich = document.createElement('div'); rich.className = 'rich-text'; rich.appendChild(formatAssistant(result.answer || 'Tidak ada jawaban.')); body.appendChild(rich); }
          else { body.textContent = result.error || 'Model tidak tersedia.'; const status = document.createElement('span'); status.className = 'comparison-status'; status.textContent = result.status === 'unavailable' ? 'Belum dikonfigurasi' : 'Tidak tersedia'; body.appendChild(status); }
          card.append(head, body); grid.appendChild(card);
        });
        row.appendChild(grid); messagesEl.appendChild(row); messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      async function loadConfig() { const config = await fetch('/api/config').then((r) => r.json()); (config.models || []).forEach((model) => { const opt = document.createElement('option'); const id = typeof model === 'string' ? model : model.id; opt.value = id; opt.textContent = typeof model === 'string' ? model : model.label; opt.disabled = typeof model !== 'string' && !model.available; if (opt.disabled) opt.textContent += ' · belum dikonfigurasi'; modelEl.appendChild(opt); }); modelEl.value = config.defaultModel; const live = Boolean(config.hasApiKey && config.mode !== 'demo-local'); statusText.textContent = live ? `AI tersambung · ${config.mode}` : 'mode demo lokal'; statusDot.classList.toggle('ready', live); updateModelNote(config); return config; }
      function updateModelNote(config) { const selected = (config?.models || []).find((model) => (typeof model === 'string' ? model : model.id) === modelEl.value); const label = typeof selected === 'string' ? selected : selected?.label || modelEl.value || 'model gratis'; modeNote.textContent = `${selected && typeof selected !== 'string' && !selected.available ? 'Fallback lokal · ' : ''}${label} · asisten SA aktif`; }
      let configState = null;
      function updateModeNote() { if (compareMode) { modeNote.textContent = 'Membandingkan tiga rekan model'; return; } updateModelNote(configState); }
      modelEl.addEventListener('change', () => updateModeNote());
      compareToggle.addEventListener('click', () => { compareMode = !compareMode; compareToggle.classList.toggle('active', compareMode); compareToggle.setAttribute('aria-pressed', String(compareMode)); compareToggle.textContent = compareMode ? '⇄ Chat tunggal' : '⇄ Bandingkan'; modelEl.disabled = compareMode; updateModeNote(); });
      document.querySelectorAll('.suggestion').forEach((button) => button.addEventListener('click', () => { inputEl.value = button.textContent; inputEl.focus(); }));
      inputEl.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); document.getElementById('composer').requestSubmit(); } });
      document.getElementById('composer').addEventListener('submit', async (event) => {
        event.preventDefault(); const message = inputEl.value.trim(); if (!message) return;
        addMessage('user', message, 'Anda'); inputEl.value = ''; sendEl.disabled = true; sendEl.textContent = '…';
        try { const endpoint = compareMode ? '/api/compare' : '/api/chat'; const payload = compareMode ? { message, history } : { message, model:modelEl.value, history }; const response = await fetch(endpoint, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(payload) }); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Gagal memproses pertanyaan.'); if (compareMode) { addComparison(data.results); history.push({ role:'user', content:message }, { role:'assistant', content:(data.results || []).map((result) => `${result.label}: ${result.answer || result.error || 'tidak tersedia'}`).join('\n') }); } else { const warning = data.warning ? `\n\nCatatan koneksi: ${data.warning}` : ''; addMessage('assistant', `${data.answer || 'Tidak ada jawaban.'}${warning}`, data.model || 'Demo lokal'); history.push({ role:'user', content:message }, { role:'assistant', content:data.answer || '' }); } }
        catch (error) { addMessage('assistant', `Terjadi kendala: ${error.message}`, 'Error'); } finally { sendEl.disabled = false; sendEl.textContent = '➤'; }
      });
      loadConfig().then((config) => { configState = config; updateModeNote(); }).catch((error) => { statusText.textContent='koneksi gagal'; modeNote.textContent=error.message; });
    </script>
  </body>
</html>
